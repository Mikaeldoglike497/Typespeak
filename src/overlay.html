<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeSpeak is listening</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="listening-pill" role="status" aria-label="TypeSpeak is listening">
      <span style="--level: 0"></span>
      <span style="--level: 1"></span>
      <span style="--level: 2"></span>
      <span style="--level: 3"></span>
      <span class="voice-mark" style="--level: 4"></span>
      <span style="--level: 5"></span>
      <span style="--level: 6"></span>
      <span style="--level: 7"></span>
      <span style="--level: 8"></span>
    </div>
    <script src="./overlay.js" defer></script>
  </body>
</html>
